<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Welcome VS Creations Customers</h1>
    <table border="2px" style="width: 35%; margin: 0 auto; border-collapse: collapse;">
    <tr style="background-color: #0a0810; color: white;"></tr>
        <thead>
            
            <th>Name</th>
            <th>Cust_Id</th>
            <th>Email</th>
            <th>Salary</th>
        </thead>
        {% for d in data %}
        <tr>
            
            <td>{{d.name}}</td>
            <td>{{d.Cust_Id}}</td>
            <td>{{d.email}}</td>
            <td>{{d.salary}}</td>
             
        </tr>     
         {% endfor %}
    </table>

</body>
<style>
    h1{
        color: rgb(12, 12, 12);
        text-align: center; 
          
    }
